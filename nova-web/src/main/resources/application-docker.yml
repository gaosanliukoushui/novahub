spring:
  application:
    name: nova-hub

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/nova_hub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectionCollation=utf8mb4_unicode_ci
    username: novahub
    password: root123
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Dynamic DataSource for read/write splitting
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://mysql:3306/nova_hub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: novahub
          password: root123
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: 20
            minimum-idle: 5

  data:
    redis:
      host: redis
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: nova-hub-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.novahub.*

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  session:
    store-type: redis
    timeout: 86400s
    redis:
      namespace: nova:session

minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: nova-hub

elasticsearch:
  host: elasticsearch
  port: 9200
  scheme: http

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    elasticsearch:
      enabled: true
    redis:
      enabled: true
    db:
      enabled: false
    probes:
      enabled: true

skywalking:
  enabled: true
  service-name: nova-hub-web
  collector-backend: skywalking-oap:11800

logging:
  level:
    com.novahub: INFO
    com.novahub.web: INFO
  file:
    name: /var/log/novahub/app.log
    max-size: 100MB
    max-history: 14
