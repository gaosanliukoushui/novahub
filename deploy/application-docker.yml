spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/nova_hub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: root123
  dynamic:
    primary: master
    strict: false
    datasource:
      master:
        url: jdbc:mysql://mysql:3306/nova_hub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        username: root
        password: root123
        driver-class-name: com.mysql.cj.jdbc.Driver
      slave:
        url: jdbc:mysql://mysql-slave:3306/nova_hub?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        username: root
        password: root123
        driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  kafka:
    bootstrap-servers: kafka:9092
  session:
    store-type: redis
    timeout: 86400s
    redis:
      namespace: nova:session
elasticsearch:
  host: elasticsearch
  port: 9200
  scheme: http
minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: nova-hub
skywalking:
  enabled: true
  service-name: nova-hub-web
  collector-backend: skywalking-oap:11800
