name: NovaHub CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify UTF-8 tracked text
        shell: pwsh
        run: |
          $files = git ls-files '*.java' '*.md' '*.sql' '*.yml' '*.yaml' '*.html' '*.css' '*.js'
          foreach ($file in $files) {
            [void][System.IO.File]::ReadAllText($file, [System.Text.UTF8Encoding]::new($false, $true))
          }

      - name: Maven test
        run: mvn -B -pl nova-web -am test

      - name: Maven package
        run: mvn -B -pl nova-web -am package -DskipTests

      - name: Docker Compose config
        run: docker compose -f deploy/docker-compose.yml config >/tmp/novahub-compose.yml
